<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refrain — Ecran</title>
<meta name="theme-color" content="#07060e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📺%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/app.css">
<style>
  body { overflow: hidden; height: 100dvh; }
  .screen { height: 100dvh; display: flex; flex-direction: column; padding: 2.2vmin 3vmin; gap: 2vmin; }

  /* --- En-tete --------------------------------------------------- */
  .head { display: flex; align-items: center; gap: 2vmin; flex: none; }
  .head .pl { display: flex; align-items: center; gap: 1.2vmin; font-family: var(--display); font-size: 2.4vmin; }
  .head .pl .em { font-size: 3.4vmin; }
  .head .mid { margin-left: auto; margin-right: auto; display: flex; align-items: center; gap: 1.4vmin; }
  .head .code-mini { font-family: var(--display); font-size: 2.4vmin; letter-spacing: .2em; }
  .progress-dots { display: flex; gap: .7vmin; }
  .progress-dots i { width: 1.1vmin; height: 1.1vmin; border-radius: 50%; background: rgba(255,255,255,.16); transition: background .4s, transform .4s; }
  .progress-dots i.done { background: rgba(255,255,255,.45); }
  .progress-dots i.now { background: linear-gradient(135deg, var(--violet), var(--cyan)); transform: scale(1.6); }

  /* --- Scenes ----------------------------------------------------- */
  .stage { flex: 1; min-height: 0; position: relative; }
  .scene { position: absolute; inset: 0; display: none; }
  .scene.on { display: flex; animation: fadeIn .45s var(--ease); }

  /* Lobby */
  #sLobby { flex-direction: column; align-items: center; justify-content: center; gap: 3vmin; text-align: center; }
  .join-row { display: flex; align-items: center; gap: 5vmin; flex-wrap: wrap; justify-content: center; }
  .code-box { display: flex; flex-direction: column; gap: 1.4vmin; align-items: flex-start; text-align: left; }
  .code-box .lbl { font-size: 1.7vmin; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  .code-big { font-family: var(--display); font-size: 15vmin; line-height: .95; letter-spacing: .08em;
    background: linear-gradient(140deg, #fff 15%, #c4b5fd 50%, #67e8f9 85%); -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 12vmin rgba(139,92,246,.35); }
  .code-box .url { font-size: 2.2vmin; color: var(--muted); }
  .code-box .url b { color: var(--text); }
  .qr { background: #fff; padding: 1.6vmin; border-radius: 2.4vmin; box-shadow: var(--shadow-2); }
  .qr svg { width: 26vmin; height: 26vmin; display: block; }

  .lobby-players { display: flex; flex-wrap: wrap; gap: 1vmin; justify-content: center; max-width: 90vw; }
  .lobby-players .who { display: inline-flex; align-items: center; gap: .8vmin; padding: .9vmin 1.8vmin; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--stroke); font-size: 2vmin; font-weight: 600; animation: popIn .4s var(--ease); }
  .lobby-players .who.off { opacity: .35; }
  .empty-hint { font-size: 2.2vmin; color: var(--faint); }

  /* Compte a rebours */
  #sCountdown { align-items: center; justify-content: center; flex-direction: column; }
  #sCountdown .n { font-family: var(--display); font-size: 36vmin; line-height: 1;
    background: linear-gradient(160deg, #fff, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #sCountdown .sub { font-size: 3vmin; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }

  /* Ecoute */
  #sPlaying { gap: 3vmin; }
  .play-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vmin; min-width: 0; }
  .ring-wrap { position: relative; width: 46vmin; height: 46vmin; display: grid; place-items: center; }
  .ring-wrap svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: rgba(255,255,255,.08); stroke-width: 2.4; }
  .ring-fg { fill: none; stroke: url(#ringGrad); stroke-width: 2.4; stroke-linecap: round; transition: stroke-dashoffset .18s linear; }
  .vinyl {
    width: 34vmin; height: 34vmin; border-radius: 50%; display: grid; place-items: center;
    background:
      radial-gradient(circle at 50% 50%, #1c1730 0 18%, transparent 18.5%),
      repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.045) 0 .35vmin, transparent .35vmin .9vmin),
      radial-gradient(circle at 35% 28%, #2b2447, #0b0916 70%);
    box-shadow: 0 4vmin 10vmin -3vmin rgba(139,92,246,.6), inset 0 0 4vmin rgba(0,0,0,.7);
    animation: spin 5.5s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .vinyl .q { font-family: var(--display); font-size: 9vmin; animation: spin 5.5s linear infinite reverse; opacity: .9; }
  .countdown-num { position: absolute; bottom: -1vmin; font-family: var(--display); font-size: 4.4vmin; font-variant-numeric: tabular-nums;
    padding: .4vmin 2.4vmin; border-radius: 999px; background: rgba(7,6,14,.85); border: 1px solid var(--stroke-strong); }
  .countdown-num.warn { color: var(--amber); border-color: rgba(251,191,36,.5); }

  .eq { display: flex; align-items: flex-end; gap: .9vmin; height: 9vmin; }
  .eq i { width: 1.3vmin; border-radius: .7vmin; background: linear-gradient(180deg, var(--cyan), var(--violet)); animation: eqBar 1s ease-in-out infinite; }
  @keyframes eqBar { 0%,100% { height: 14% } 50% { height: 100% } }
  .paused .eq i, .paused .vinyl, .paused .vinyl .q { animation-play-state: paused; }

  /* Panneau lateral joueurs */
  .side { width: 34vmin; flex: none; display: flex; flex-direction: column; gap: 1.2vmin; overflow: hidden; }
  .side h3 { font-size: 1.6vmin; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); }
  .side .list { display: flex; flex-direction: column; gap: .8vmin; overflow: hidden; }
  .prow { display: flex; align-items: center; gap: 1.2vmin; padding: 1.1vmin 1.6vmin; border-radius: 1.4vmin;
    background: var(--surface); border: 1px solid var(--stroke); transition: background .3s, border-color .3s; }
  .prow .av { font-size: 2.4vmin; }
  .prow .nm { flex: 1; min-width: 0; font-weight: 600; font-size: 2vmin; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow .sc { font-family: var(--display); font-weight: 700; font-size: 2.2vmin; font-variant-numeric: tabular-nums; }
  .prow .marks { display: flex; gap: .4vmin; font-size: 1.7vmin; }
  .prow.done { background: rgba(52,211,153,.14); border-color: rgba(52,211,153,.4); }
  .prow.part { background: rgba(251,191,36,.12); border-color: rgba(251,191,36,.32); }
  .prow.off { opacity: .35; }

  /* Buzz */
  #sBuzzed { align-items: center; justify-content: center; flex-direction: column; gap: 2vmin; }
  .buzz-av { font-size: 16vmin; animation: buzzShake .6s var(--ease); }
  @keyframes buzzShake { 0%{transform:scale(.5) rotate(-12deg);opacity:0} 60%{transform:scale(1.15) rotate(6deg);opacity:1} 100%{transform:scale(1)} }
  .buzz-name { font-family: var(--display); font-size: 9vmin; line-height: 1;
    background: linear-gradient(120deg, #fff, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .buzz-sub { font-size: 2.6vmin; color: var(--muted); }

  /* Reponse */
  #sReveal { gap: 4vmin; align-items: center; justify-content: center; }
  .reveal-main { display: flex; align-items: center; gap: 5vmin; max-width: 120vmin; min-width: 0; }
  .cover-lg { width: 40vmin; height: 40vmin; border-radius: 3vmin; flex: none; box-shadow: 0 4vmin 10vmin -3vmin rgba(0,0,0,.9), 0 0 0 1px var(--stroke);
    animation: coverIn .6s var(--ease); object-fit: cover; background: var(--surface-2); }
  @keyframes coverIn { from { opacity: 0; transform: scale(.85) rotate(-4deg); } to { opacity: 1; transform: none; } }
  .reveal-text { min-width: 0; max-width: 66vmin; }
  .reveal-text .kicker { font-size: 1.8vmin; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); font-weight: 700; margin-bottom: 1.4vmin; }
  .reveal-text .title { font-family: var(--display); font-size: 6.4vmin; line-height: 1.05; margin-bottom: 1.2vmin; }
  .reveal-text .artist { font-size: 3.6vmin; color: #c4b5fd; font-weight: 600; }
  .reveal-text .album { font-size: 2vmin; color: var(--faint); margin-top: 1vmin; }
  .scorers { display: flex; flex-wrap: wrap; gap: 1vmin; margin-top: 2.6vmin; }
  .scorers .s { display: inline-flex; align-items: center; gap: .8vmin; padding: .9vmin 1.7vmin; border-radius: 999px; font-size: 2vmin; font-weight: 600;
    background: rgba(52,211,153,.16); border: 1px solid rgba(52,211,153,.4); color: #b6f7de; animation: popIn .45s var(--ease) backwards; }
  .scorers .s .pts { font-family: var(--display); }
  .scorers .none { font-size: 2.2vmin; color: var(--faint); }

  /* Classement */
  #sScores { flex-direction: column; gap: 2vmin; align-items: center; justify-content: center; }
  #sScores h2 { font-size: 5vmin; }
  .bars { width: min(120vmin, 92vw); display: flex; flex-direction: column; gap: 1.2vmin; }
  .bar { display: flex; align-items: center; gap: 1.6vmin; }
  .bar .pos { font-family: var(--display); font-size: 2.6vmin; width: 4vmin; text-align: right; color: var(--faint); }
  .bar .av { font-size: 2.8vmin; }
  .bar .nm { width: 24vmin; font-weight: 600; font-size: 2.2vmin; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .track { flex: 1; height: 3.4vmin; border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--violet), var(--cyan)); transition: width .9s var(--ease); }
  .bar .sc { font-family: var(--display); font-size: 2.6vmin; width: 7vmin; font-variant-numeric: tabular-nums; }
  .bar.top1 .fill { background: linear-gradient(90deg, #f59e0b, #fbbf24); }

  /* Podium */
  #sEnd { flex-direction: column; align-items: center; justify-content: center; gap: 3vmin; }
  #sEnd h2 { font-size: 6vmin; background: linear-gradient(120deg,#fff,#fbbf24); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .podium { display: flex; align-items: flex-end; gap: 2.4vmin; position: relative; padding-bottom: 1.4vmin; }
  .podium::after { content: ''; position: absolute; left: -4vmin; right: -4vmin; bottom: 0; height: .5vmin; border-radius: 99px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.28) 12%, rgba(255,255,255,.28) 88%, transparent); }
  .step { display: flex; flex-direction: column; align-items: center; gap: 1.2vmin; animation: rise .7s var(--ease) backwards; }
  @keyframes rise { from { transform: translateY(30%); opacity: 0 } to { transform: none; opacity: 1 } }
  .step .av { font-size: 6vmin; }
  .step .nm { font-family: var(--display); font-size: 2.6vmin; max-width: 26vmin; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step .block { width: 22vmin; border-radius: 2vmin 2vmin 0 0; display: grid; place-items: center;
    background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.04)); border: 1px solid var(--stroke); border-bottom: 0; }
  .step .block .pts { font-family: var(--display); font-size: 4vmin; }
  .step.p1 .block { height: 26vmin; background: linear-gradient(180deg, rgba(251,191,36,.4), rgba(251,191,36,.06)); border-color: rgba(251,191,36,.5); }
  .step.p2 .block { height: 19vmin; }
  .step.p3 .block { height: 14vmin; }
  .rest { display: flex; flex-wrap: wrap; gap: 1vmin; justify-content: center; max-width: 80vw; }
  .rest .r { padding: .8vmin 1.6vmin; border-radius: 999px; background: var(--surface); border: 1px solid var(--stroke); font-size: 1.9vmin; }

  /* --- Superpositions --------------------------------------------- */
  .gate { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: rgba(7,6,14,.94); backdrop-filter: blur(10px); text-align: center; padding: 4vmin; }
  .gate.off { display: none; }
  .gate h1 { font-size: 6vmin; margin-bottom: 1.6vmin; }
  .gate p { color: var(--muted); font-size: 2.2vmin; margin-bottom: 3vmin; }
  .gate .code-input { text-align: center; font-family: var(--display); font-size: 5vmin; letter-spacing: .3em; text-indent: .3em; text-transform: uppercase; width: 40vmin; margin: 0 auto 2vmin; }

  .corner { position: fixed; right: 2vmin; bottom: 2vmin; z-index: 40; display: flex; align-items: center; gap: 1vmin; opacity: .25; transition: opacity .25s; }
  .corner:hover { opacity: 1; }
  .corner .btn { font-size: 1.6vmin; padding: .8vmin 1.6vmin; }
  #vol { width: 14vmin; }
  #confettiCanvas { position: fixed; inset: 0; z-index: 45; pointer-events: none; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="screen" id="screen">
  <header class="head">
    <div class="pl"><span class="em" id="plEmoji">🎧</span><span id="plTitle">Refrain</span></div>
    <div class="mid">
      <span class="pill" id="roundPill" hidden>Manche <b id="roundNo">1</b> / <b id="roundTotal">10</b></span>
      <div class="progress-dots" id="dots"></div>
    </div>
    <span class="pill"><span class="dot"></span> <span class="code-mini" id="codeMini">····</span></span>
  </header>

  <div class="stage">
    <!-- Lobby -->
    <section class="scene on" id="sLobby">
      <div class="join-row">
        <div class="code-box">
          <span class="lbl">Code de la partie</span>
          <div class="code-big" id="codeBig">····</div>
          <div class="url">Rejoins sur <b id="joinUrl">—</b></div>
        </div>
        <div class="qr" id="qr"></div>
      </div>
      <div class="lobby-players" id="lobbyPlayers"></div>
      <div class="empty-hint" id="lobbyHint">En attente des joueurs…</div>
    </section>

    <!-- Compte a rebours -->
    <section class="scene" id="sCountdown">
      <div class="n" id="cdNum">3</div>
      <div class="sub" id="cdSub">Manche 1</div>
    </section>

    <!-- Ecoute -->
    <section class="scene" id="sPlaying">
      <div class="play-main">
        <div class="ring-wrap">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#8b5cf6"/>
            </linearGradient></defs>
            <circle class="ring-bg" cx="50" cy="50" r="47"/>
            <circle class="ring-fg" id="ringFg" cx="50" cy="50" r="47" stroke-dasharray="295.3" stroke-dashoffset="0"/>
          </svg>
          <div class="vinyl"><span class="q">?</span></div>
          <div class="countdown-num tnum" id="secLeft">25</div>
        </div>
        <div class="eq" id="eq"></div>
      </div>
      <aside class="side">
        <h3 id="sideTitle">Joueurs</h3>
        <div class="list" id="sideList"></div>
      </aside>
    </section>

    <!-- Buzz -->
    <section class="scene" id="sBuzzed">
      <div class="buzz-av" id="buzzAv">🔔</div>
      <div class="buzz-name" id="buzzName">—</div>
      <div class="buzz-sub">a buzze — la reponse, vite !</div>
    </section>

    <!-- Reponse -->
    <section class="scene" id="sReveal">
      <div class="reveal-main grow">
        <img class="cover-lg" id="revCover" alt="">
        <div class="reveal-text grow">
          <div class="kicker">La reponse etait</div>
          <div class="title" id="revTitle">—</div>
          <div class="artist" id="revArtist">—</div>
          <div class="album" id="revAlbum"></div>
          <div class="scorers" id="scorers"></div>
        </div>
      </div>
    </section>

    <!-- Classement -->
    <section class="scene" id="sScores">
      <h2>Classement</h2>
      <div class="bars" id="bars"></div>
    </section>

    <!-- Fin -->
    <section class="scene" id="sEnd">
      <h2>🏆 Resultats</h2>
      <div class="podium" id="podium"></div>
      <div class="rest" id="rest"></div>
    </section>
  </div>
</div>

<canvas id="confettiCanvas"></canvas>

<div class="corner">
  <span class="pill" id="audioPill">🔇 son coupe</span>
  <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume">
  <button class="btn sm" id="fsBtn" type="button">⛶ Plein ecran</button>
</div>

<div class="gate" id="gate">
  <div>
    <h1 id="gateTitle">Ecran de diffusion</h1>
    <p id="gateText">Saisis le code de la partie affiche dans la regie.</p>
    <form id="gateForm">
      <input class="input code-input" id="gateCode" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button class="btn primary lg" type="submit" id="gateBtn">Connecter l'ecran</button>
    </form>
  </div>
</div>

<audio id="audio" preload="auto"></audio>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/screen.js"></script>
</body>
</html>
