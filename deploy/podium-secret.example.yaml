# Raccordement a Podium — MODELE, ne jamais commiter les vraies valeurs.
#
# Podium est le hub des jeux : comptes, ranked, defis hebdo et musique du jour.
# Trois valeurs suffisent, toutes lues en `optional: true` par le Deployment :
# sans ce Secret, Refrain demarre normalement et ignore le hub.
#
#   PODIUM_URL         origine publique du hub, ex. https://podium.danwalex.com
#   PODIUM_GAME_KEY    cle d'ingestion du jeu « refrain », generee dans /admin/jeux
#   PODIUM_SSO_SECRET  le SSO_SECRET du hub, pour verifier le cookie d'identite
#
# Renseigne le secret sans passer par un fichier :
#
#   kubectl -n refrain create secret generic podium-integration \
#     --from-literal=PODIUM_URL='https://podium.danwalex.com' \
#     --from-literal=PODIUM_GAME_KEY='...' \
#     --from-literal=PODIUM_SSO_SECRET='...' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   kubectl -n refrain rollout restart deploy/refrain
apiVersion: v1
kind: Secret
metadata:
  name: podium-integration
  namespace: refrain
type: Opaque
stringData:
  PODIUM_URL: ""
  PODIUM_GAME_KEY: ""
  PODIUM_SSO_SECRET: ""
