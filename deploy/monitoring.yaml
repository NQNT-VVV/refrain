# Supervision de Refrain : scrape Prometheus + tableau de bord Grafana.
#   kubectl apply -f deploy/monitoring.yaml
#
# Le Prometheus du cluster (kube-prometheus-stack) accepte tous les
# ServiceMonitor, quel que soit leur namespace, et le sidecar Grafana charge
# toute ConfigMap portant le label grafana_dashboard=1.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: refrain
  namespace: refrain
  labels:
    app.kubernetes.io/name: refrain
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: refrain
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: refrain-dashboard
  namespace: refrain
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Refrain"
