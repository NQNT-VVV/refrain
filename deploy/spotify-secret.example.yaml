# Identifiants Spotify — MODELE, ne jamais commiter les vraies valeurs.
#
# Cree une application sur https://developer.spotify.com/dashboard : elle donne
# un Client ID et un Client Secret. Le flux « client credentials » suffit,
# aucune redirection ni consentement utilisateur n'est necessaire.
#
# Renseigne le secret sans passer par un fichier :
#
#   kubectl -n refrain create secret generic refrain-spotify \
#     --from-literal=SPOTIFY_CLIENT_ID='ton-client-id' \
#     --from-literal=SPOTIFY_CLIENT_SECRET='ton-client-secret' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   kubectl -n refrain rollout restart deploy/refrain
#
# Le Deployment lit ces cles en `optional: true` : sans le secret, l'application
# demarre normalement et l'import Spotify est simplement masque dans la regie.
apiVersion: v1
kind: Secret
metadata:
  name: refrain-spotify
  namespace: refrain
type: Opaque
stringData:
  SPOTIFY_CLIENT_ID: ""
  SPOTIFY_CLIENT_SECRET: ""
