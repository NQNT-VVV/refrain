# Refrain — deploiement minimal.
#   kubectl apply -f deploy/refrain.yaml
#
# L'etat des parties (salons, scores, manches) vit en memoire : une seule
# instance, et un redemarrage vide les parties en cours. C'est voulu — pas de
# base de donnees a maintenir pour une soiree blind test.
apiVersion: v1
kind: Namespace
metadata:
  name: refrain
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: refrain
  namespace: refrain
  labels:
    app.kubernetes.io/name: refrain
spec:
  replicas: 1
  strategy:
    type: Recreate          # jamais deux instances en parallele : l'etat est local
  selector:
    matchLabels:
      app.kubernetes.io/name: refrain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: refrain
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: refrain
          image: ghcr.io/nqnt-vvv/refrain:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9464
          env:
            - name: PORT
              value: "3000"
            - name: METRICS_PORT
              value: "9464"
            # Identifiants Spotify : facultatifs. Sans eux l'application tourne
            # normalement, l'import de playlists Spotify est simplement masque.
            - name: SPOTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: refrain-spotify
                  key: SPOTIFY_CLIENT_ID
                  optional: true
            - name: SPOTIFY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: refrain-spotify
                  key: SPOTIFY_CLIENT_SECRET
                  optional: true
            # Podium : facultatif. Sans ce Secret, aucun compte n'est reconnu,
            # rien n'est envoye au hub, et le jeu tourne exactement comme avant.
            - name: PODIUM_URL
              valueFrom:
                secretKeyRef:
                  name: podium-integration
                  key: PODIUM_URL
                  optional: true
            - name: PODIUM_GAME_KEY
              valueFrom:
                secretKeyRef:
                  name: podium-integration
                  key: PODIUM_GAME_KEY
                  optional: true
            - name: PODIUM_SSO_SECRET
              valueFrom:
                secretKeyRef:
                  name: podium-integration
                  key: PODIUM_SSO_SECRET
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 320Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cache
              mountPath: /app/.cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache          # listes Deezer mises en cache 6 h
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: refrain
  namespace: refrain
  labels:
    app.kubernetes.io/name: refrain
spec:
  selector:
    app.kubernetes.io/name: refrain
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics          # scrape par Prometheus, jamais expose par l'Ingress
      port: 9464
      targetPort: metrics
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: refrain
  namespace: refrain
  annotations:
    # Socket.IO garde des connexions ouvertes toute la partie :
    # sans ces delais nginx les coupe au bout de 60 s.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: refrain.danwalex.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: refrain
                port:
                  number: 80
